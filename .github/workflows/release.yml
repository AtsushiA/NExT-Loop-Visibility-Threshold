name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  # zip / 展開フォルダ名（リポジトリのディレクトリ名に合わせる）
  PLUGIN_SLUG: NExT-Loop-Visibility-Threshold
  # プラグインのメインファイル（slug と大文字小文字が異なるため明示）
  MAIN_FILE: next-loop-visibility-threshold.php

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches plugin header
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          HEADER_VERSION=$(grep -oP 'Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "${MAIN_FILE}")
          if [ "$HEADER_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin header version ($HEADER_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION verified."

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Create plugin zip
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        # 本プラグインは実行時の Composer 依存を持たず（require は php のみ）、クラスは
        # require_once で読み込むため Composer オートローダを使わない。よって vendor/ は
        # 配布物から除外する。将来、本番依存を追加した場合は vendor の exclude を外すこと。
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.husky' \
            --exclude='bin' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml.dist' \
            --exclude='.distignore' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='debug.log' \
            --exclude='db.sql' \
            ./ "${PLUGIN_SLUG}/"
          zip -r "${PLUGIN_SLUG}-${TAG_VERSION}.zip" "${PLUGIN_SLUG}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN_SLUG }}-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: true
